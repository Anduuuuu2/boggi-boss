<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="t">
  <title id="t">Boggi, el jefe del equipo, con auriculares de coordinador señalando para delegar</title>
  <defs>
    <linearGradient id="boggiFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD3B4"/>
      <stop offset="1" stop-color="#FFAE7C"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="#1C1B22" stroke-linecap="round" stroke-linejoin="round">
    <!-- pies -->
    <ellipse cx="94" cy="210" rx="17" ry="8" fill="#F2925A" stroke-width="4"/>
    <ellipse cx="150" cy="210" rx="17" ry="8" fill="#F2925A" stroke-width="4"/>
    <!-- brazo izquierdo apoyado -->
    <path d="M44 156 C30 162 28 176 36 184" stroke-width="4.5"/>
    <!-- cuerpo guijarro ancho -->
    <path d="M40 148 C37 100 72 64 124 64 C178 64 207 100 203 148 C200 186 170 205 121 205 C72 205 43 186 40 148 Z" fill="url(#boggiFill)" stroke-width="5"/>
    <!-- auriculares de coordinador -->
    <path d="M54 118 C50 46 192 44 188 116" stroke-width="5"/>
    <rect x="42" y="106" width="18" height="30" rx="8" fill="#1C1B22" stroke-width="3"/>
    <rect x="182" y="104" width="18" height="30" rx="8" fill="#1C1B22" stroke-width="3"/>
    <path d="M54 134 C58 158 76 166 94 163" stroke-width="3.5"/>
    <circle cx="98" cy="162" r="5.5" fill="#1C1B22" stroke-width="2"/>
    <!-- cejas: una levantada, gesto seguro -->
    <path d="M90 98 C98 92 108 92 114 96" stroke-width="4.5"/>
    <path d="M136 90 C144 84 156 85 162 92" stroke-width="4.5"/>
    <!-- ojos ovalados con brillo -->
    <ellipse cx="103" cy="117" rx="8.5" ry="11.5" fill="#1C1B22" stroke="none"/>
    <ellipse cx="148" cy="115" rx="8.5" ry="11.5" fill="#1C1B22" stroke="none"/>
    <circle cx="106" cy="112" r="3" fill="#FFFFFF" stroke="none"/>
    <circle cx="151" cy="110" r="3" fill="#FFFFFF" stroke="none"/>
    <!-- mejillas -->
    <ellipse cx="84" cy="140" rx="10" ry="6" fill="#FF8F7A" opacity=".45" stroke="none"/>
    <ellipse cx="170" cy="138" rx="10" ry="6" fill="#FF8F7A" opacity=".45" stroke="none"/>
    <!-- sonrisa ladeada -->
    <path d="M112 146 C122 156 136 156 144 143" stroke-width="4.5"/>
    <!-- brazo derecho delegando -->
    <path d="M201 140 C218 136 226 124 228 108" stroke-width="4.5"/>
    <path d="M228 108 L236 98" stroke-width="4"/>
    <!-- trazos de gesto -->
    <path d="M214 86 L220 76" stroke-width="3"/>
    <path d="M226 92 L236 86" stroke-width="3"/>
  </g>
</svg>
